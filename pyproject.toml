[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legis-service-estados"
version = "0.1.0"
description = "Microservice modular que cobre as 11 ALs estaduais sem API REST, expondo dados no contrato ProposicaoNormalizadaRaw"
authors = [{ name = "Willian Lima", email = "willian.lima@legalbot.com.br" }]
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "lxml>=5.1",
    "aiolimiter>=1.1",
    "pybreaker>=1.2",
    "structlog>=24.1",
    "tenacity>=8.2",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-lxml>=2024.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line-length (já configurado em line-length=110)
    "E402",   # module-import-not-at-top (alguns adapters fazem import dentro de função intencionalmente)
    "B904",   # raise without from in except (tolerado em handlers globais)
    "B008",   # function-call-in-default-argument (FastAPI Query/Depends é convenção)
    "RUF002", # ambiguous-unicode-character-docstring (queremos acentos nas docstrings PT-BR)
    "RUF012", # mutable-class-default (singletons de cache controlados manualmente)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
